name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

env:
  HELM_VERSION: v4.2.4
  HELM_UNITTEST_VERSION: v1.2.1
  HELM_DOCS_VERSION: 1.14.2
  YQ_VERSION: v4.53.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo build
        run: cargo build --workspace --locked

      - name: Cargo check
        run: cargo check --workspace --locked

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  image:
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install yq
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "$RUNNER_TEMP/bin/yq"
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install goss
        env:
          GOSS_VERSION: 0.4.10
        run: |
          set -euo pipefail
          goss_tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/goss-org/goss/releases/download/v${GOSS_VERSION}/goss_${GOSS_VERSION}_linux_x86_64.tar.gz" -o "$goss_tmp/goss.tar.gz"
          tar -xzf "$goss_tmp/goss.tar.gz" -C "$goss_tmp" goss
          sudo install -m 0755 "$goss_tmp/goss" /usr/local/bin/goss
          goss --version

      - name: Build image
        run: docker build -t brrpolice-ci:test -f Dockerfile .

      - name: Validate image with goss
        run: goss -g ci/goss/docker-image.yaml validate

      - name: Validate populated database migration with read-only root
        run: python3 ci/check-migrations.py

      - name: Resolve image name
        if: env.PUBLISH_IMAGE == 'true'
        id: image
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve image metadata
        if: env.PUBLISH_IMAGE == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Validate publish tag contract
        if: env.PUBLISH_IMAGE == 'true'
        env:
          RESOLVED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          expected_tag="${GITHUB_REF_NAME//\//-}"
          mapfile -t tags < <(printf "%s\n" "$RESOLVED_TAGS" | sed '/^$/d')
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "expected exactly one publish tag, got ${#tags[@]}: ${tags[*]}" >&2
            exit 1
          fi
          actual_ref="${tags[0]}"
          actual_tag="${actual_ref##*:}"
          if [ "$actual_tag" != "$expected_tag" ]; then
            echo "expected publish tag '$expected_tag' but got '$actual_tag'" >&2
            exit 1
          fi

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: env.PUBLISH_IMAGE == 'true'
        env:
          RESOLVED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf "%s\n" "$RESOLVED_TAGS" | sed '/^$/d')
          for tag in "${tags[@]}"; do
            docker tag brrpolice-ci:test "$tag"
            docker push "$tag"
          done

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install chart validation tools
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/helm-docs.tar.gz"
          tar -xzf "$RUNNER_TEMP/helm-docs.tar.gz" -C "$RUNNER_TEMP/bin" helm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint and test chart
        run: |
          helm lint --strict charts/brrpolice --set config.qbittorrent.base_url=http://qbittorrent.default.svc.cluster.local
          helm unittest --strict charts/brrpolice
          python3 ci/check-chart-values.py

      - name: Check generated chart documentation
        run: |
          helm-docs --chart-search-root charts
          git diff --exit-code -- charts/brrpolice/README.md

  publish-chart:
    needs:
      - image
      - chart
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install packaging tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "$RUNNER_TEMP/bin/yq"
          chmod +x "$RUNNER_TEMP/bin/yq"
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" -o "$RUNNER_TEMP/helm-docs.tar.gz"
          tar -xzf "$RUNNER_TEMP/helm-docs.tar.gz" -C "$RUNNER_TEMP/bin" helm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pin released image and package chart
        run: |
          set -euo pipefail
          version="$(yq -r '.version' charts/brrpolice/Chart.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          repository="$(yq -r '.image.repository' charts/brrpolice/values.yaml)"
          export IMAGE_TAG="v${version}"
          DIGEST="$(docker buildx imagetools inspect "${repository}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          export DIGEST
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          yq -i '.image.tag = strenv(IMAGE_TAG) | .image.digest = strenv(DIGEST)' charts/brrpolice/values.yaml
          helm-docs --chart-search-root charts
          helm package charts/brrpolice --version "$version" --app-version "$version" --destination "$RUNNER_TEMP"
          helm show values "$RUNNER_TEMP/brrpolice-${version}.tgz" | yq -e '.image.tag == strenv(IMAGE_TAG) and .image.digest == strenv(DIGEST)'
          echo "CHART_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish chart to GHCR (OCI)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/brrpolice-${CHART_VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
