{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (ne .Values.controller.type "statefulset") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "brrpolice.fullname" . }}
  labels:
    {{- include "brrpolice.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "brrpolice.dataClaimSpec" . | nindent 2 }}
{{- end }}
